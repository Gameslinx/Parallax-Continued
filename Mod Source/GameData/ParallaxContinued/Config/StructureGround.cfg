ParallaxStructureGround
{
    // Ground materials on structures (the KSC, launch sites, Kerbal Konstructs statics) are replaced with the Parallax terrain shader where their blend mask is black
    // If your structures use their own ground shader, module manager patch this config and append it to the list

    // Every material on these shaders is ground
    Shaders
    {
        name = KSP/Scenery/Diffuse Ground KSC
        name = KSP/Scenery/Diffuse Ground KSC Specular
        name = KSP/Scenery/Diffuse Ground KSC Specular Far Fix
        name = KK/Ground_Multi_NoUV
        name = KK/Diffuse_Multiply_Random
    }

    // Ground materials on shaders that are also used for other surfaces, matched by material name
    Materials
    {
        name = ksc_exterior_terrain_grass_02
    }
}

